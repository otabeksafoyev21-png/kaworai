name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow manual runs for debugging.
  workflow_dispatch:

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff (lint)
        run: ruff check .

      - name: ruff (format check)
        run: ruff format --check .

      - name: mypy
        # Do not fail the build on type errors yet — the legacy handlers
        # need a pass before mypy can be enforced. Report-only for now so
        # we can watch the error count shrink.
        continue-on-error: true
        run: mypy .

  compile:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: py_compile every module
        run: |
          python -m compileall -q -f . -x "venv|__pycache__"
